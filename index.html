<style>
:root{--bg:#f4f1ea;--bar:#fffdf8;--t:#26231d;--m:#7a7467;--b:#ddd6c6;--a:#1f5f4a;--at:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#171a17;--bar:#202420;--t:#ece8dc;--m:#a39e90;--b:#38403a;--a:#6fcf9f;--at:#0f1a13}}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#171a17;--bar:#202420;--t:#ece8dc;--m:#a39e90;--b:#38403a;--a:#6fcf9f;--at:#0f1a13}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.tabs{display:flex;gap:6px;padding:8px 12px 0;background:var(--bar);border-bottom:1px solid var(--b);flex-shrink:0;overflow-x:auto}
.tab{appearance:none;background:transparent;color:var(--m);border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--t)}
.tab.active{background:var(--bg);color:var(--a);border-color:var(--b)}
.pane{flex:1;min-height:0;display:none}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:0;display:block;background:transparent}

#qz{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;transition:opacity .6s ease}
#qz.out{opacity:0;pointer-events:none}
#qz .card{background:var(--bar);border:1px solid var(--b);border-radius:14px;padding:28px 26px;max-width:520px;width:100%;text-align:center;box-shadow:0 8px 30px #0003}
#qz h2{margin:0 0 22px;font-size:20px;line-height:1.35;letter-spacing:.01em}
#qz .btns{display:flex;gap:18px;justify-content:center;align-items:center;min-height:48px}
#qz button{font:inherit;font-weight:700;font-size:16px;padding:10px 30px;border-radius:8px;border:0;cursor:pointer}
#qzY{background:var(--a);color:var(--at)}
#qzN{background:#c0392b;color:#fff;transition:left .18s ease,top .18s ease}
#qzN.run{position:fixed;z-index:10000}
#qzT{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(127,127,127,.16);color:var(--t);padding:16px 26px;border:0;border-radius:0;font-weight:500;font-size:16px;box-shadow:none;z-index:10001;opacity:1;transition:opacity 1.4s ease;text-align:center;max-width:90vw}
#qzT.fade{opacity:0}
</style>

    document.querySelector('#pane-' + id + ' iframe').srcdoc = decode(SRC[id]);
  }
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.tab)));
// Shared theme: the Light/Dark button in any converter posts here, then is copied to the other tabs.
let cur=null;try{cur=localStorage.getItem('moodle-theme')}catch(e){}
function sendTheme(f){if(cur&&f.contentWindow)try{f.contentWindow.postMessage({moodleTheme:cur},'*')}catch(e){}}
document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>sendTheme(f)));
addEventListener('message',e=>{
  const t=e.data&&e.data.moodleTheme;
  if(t!=='light'&&t!=='dark')return;
  const fs=[...document.querySelectorAll('iframe')];
  if(!fs.some(f=>f.contentWindow===e.source))return;
  cur=t;document.documentElement.setAttribute('data-theme',t);
  fs.forEach(f=>{if(f.contentWindow!==e.source)sendTheme(f)});
});
show('t2w');
</script>

<script>
// Pop-up question: shows on every page open (no storage used), not on tab switch.
(function(){
  var qz=document.getElementById('qz'),Y=document.getElementById('qzY'),N=document.getElementById('qzN'),running=false;
  function overlap(a,b,m){return !(a.right+m<b.left||a.left-m>b.right||a.bottom+m<b.top||a.top-m>b.bottom)}
  function dodge(){
    var w=N.offsetWidth,h=N.offsetHeight,vw=innerWidth,vh=innerHeight,yr=Y.getBoundingClientRect(),cur=N.getBoundingClientRect(),x,y,tries=0,pad=10;
    if(!running){running=true;var ph=document.createElement('span');ph.style.cssText='display:inline-block;width:'+cur.width+'px;height:'+cur.height+'px';N.parentNode.insertBefore(ph,N);N.classList.add('run');N.style.left=cur.left+'px';N.style.top=cur.top+'px'}
    do{
      x=pad+Math.random()*Math.max(1,vw-w-2*pad);y=pad+Math.random()*Math.max(1,vh-h-2*pad);tries++;
      var r={left:x,top:y,right:x+w,bottom:y+h};
      var farFromCur=Math.hypot(x-cur.left,y-cur.top)>Math.min(vw,vh)*0.3;
    }while((overlap(r,yr,16)||!farFromCur)&&tries<60);
    N.style.left=x+'px';N.style.top=y+'px';
  }
  ['pointerenter','pointerdown','touchstart','mouseover','focus'].forEach(function(ev){
    N.addEventListener(ev,function(e){if(e.cancelable)e.preventDefault();dodge();if(ev==='focus')Y.focus()},{passive:false});
  });
  N.addEventListener('click',function(e){e.preventDefault();dodge()});
  addEventListener('resize',function(){if(running)dodge()});
  Y.addEventListener('click',function(){
    var t=document.createElement('div');t.id='qzT';t.textContent='Terima kasih atas maklum balas anda';
    document.body.appendChild(t);
    qz.classList.add('out');
    setTimeout(function(){t.classList.add('fade')},1200);
    setTimeout(function(){t.remove();qz.remove()},2700);
  });
  Y.focus();
})();
</script>
